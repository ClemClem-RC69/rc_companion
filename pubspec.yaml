name: rc_companion
description: "Application de suivi des modèles RC et batteries."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.16.0
  image_picker: ^1.2.1
  pdf: ^3.11.3
  printing: ^5.14.2

  file_picker: 10.3.10
  pdfrx: ^2.4.7
  mobile_scanner: ^7.3.0

  # SCANNER QR WINDOWS
  # Webcam intégrée directement dans la page RC Companion.
  # Le scanner mobile_scanner reste inchangé sur Android/iOS/macOS.
  camera_platform_interface: ^2.13.1
  camera_windows: ^0.2.6+4
  image: ^4.9.1
  zxing2: ^0.2.4

  # OFFLINE FIRST
  drift: ^2.29.0
  drift_flutter: ^0.2.5
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^7.0.0
  workmanager: ^0.10.7

  # GOOGLE DRIVE
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  device_info_plus: 11.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  drift_dev: ^2.29.0
  build_runner: ^2.6.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
